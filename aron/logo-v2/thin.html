<h1>ARON · Wordmark (Thin)</h1><p>A와 R은 위로 갈수록 무겁게(꼭짓점·윗가로획이 굵고 아래는 가늘게), O와 N은 아래로 무겁게 — 위와 아래가 서로 균형을 잡아요. O는 사선 강세(가라몬드식). 기존 로고 형태(가로획 없는 A, 깎인 R, O, N) 그대로, ON은 회색 그라데이션. 아래는 비교용 기존 Thin.</p>
